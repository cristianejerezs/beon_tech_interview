[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-airport-data-platform"
version = "0.1.0"
description = "Question-driven analytics for historical NYC-area airport data."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.2,<2",
    "jsonschema>=4.22,<5",
    "langchain-core>=0.3.33,<2",
    "langchain-ollama>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "plotly>=5.24,<7",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "reportlab>=4.2,<6",
    "streamlit>=1.42,<2",
    "tiktoken>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "pypdf>=4,<6",
    "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
